name: APEX build and Android artifacts

# One gate for a release candidate: install from the lockfile, run the Node suites and the release audit, build the web app, then build the
# Android debug APK, the release APK and the release bundle (AAB). Any failing step fails the run. Release artifacts are signed only when the
# repository secrets below exist; without them they are uploaded UNSIGNED and are not installable until signed with the real key.
#   APEX_KEYSTORE_BASE64, APEX_KEYSTORE_PASSWORD, APEX_KEY_ALIAS, APEX_KEY_PASSWORD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Test, verify, build, package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APEX_KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
      APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
      APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
      APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Run release verification (tests and release audit)
        run: npm run verify

      - name: Build web application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Restore release keystore (only when the secrets exist)
        if: env.APEX_KEYSTORE_BASE64 != ''
        run: |
          echo "$APEX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apex-release.jks"
          echo "APEX_KEYSTORE_PATH=$RUNNER_TEMP/apex-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK, release APK and release bundle
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Name artifacts by version
        id: names
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist-artifacts/debug dist-artifacts/release
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-artifacts/debug/APEX-$VERSION-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist-artifacts/release/APEX-$VERSION-release.apk"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist-artifacts/release/APEX-$VERSION-release-UNSIGNED.apk"
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab "dist-artifacts/release/APEX-$VERSION-release.aab"
          ls -lR dist-artifacts

      - name: Upload APEX debug APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: dist-artifacts/debug/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload APEX release APK and bundle
        uses: actions/upload-artifact@v4
        with:
          name: APEX-release
          path: dist-artifacts/release/*
          if-no-files-found: error
          retention-days: 14
